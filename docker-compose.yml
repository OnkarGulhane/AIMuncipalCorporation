version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ai_case_manager_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: ai_case_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_case_manager_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "AI Municipal Case Manager"
      ENVIRONMENT: development
      DATABASE_URL: postgresql://postgres:postgrespassword123@db:5432/ai_case_manager
      JWT_SECRET_KEY: development_jwt_secret_key_minimum_32_characters_long_12345
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000","*"]'
      UPLOAD_DIR: uploads
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
